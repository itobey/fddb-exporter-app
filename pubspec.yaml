name: fddb_exporter_app
description: "A control app for FDDB-Exporter"
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.8
  shared_preferences: ^2.0.15
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  get_it: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

